spring.application.name=ms_venta
server.port=${SERVER_PORT:8083}

# Database Configuration (H2 en memoria por defecto, MySQL vía variables de entorno)
spring.datasource.url=${DB_URL:jdbc:h2:mem:ventadb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# FLYWAY
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true


# JWT (clave compartida con ms-auth, provista por variable de entorno)
jwt.secret=${JWT_SECRET}

# Servicios externos + Feign
services.inventario.url=${INVENTARIO_SERVICE_URL:http://localhost:8082}
spring.cloud.openfeign.client.config.default.connect-timeout=3000
spring.cloud.openfeign.client.config.default.read-timeout=5000

# LOGS
logging.level.root=INFO
logging.level.org.gestionpastelera=DEBUG
logging.file.name=logs/ms-venta.log
